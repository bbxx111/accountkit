services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sdk_fixture
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: sdk_fixture
    ports:
      - "127.0.0.1:15439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdk_fixture -d sdk_fixture"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16389:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
