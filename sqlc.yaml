version: "2"
sql:
  - engine: "postgresql"
    queries: "user/query.sql"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/userdb"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "sign_in_completion_flow.state"
            go_type:
              import: "github.com/bbxx111/accountkit/enum"
              type: "FlowState"
          - column: "user_account.state"
            go_type:
              import: "github.com/bbxx111/accountkit/enum"
              type: "UserState"
          - column: "identity.kind"
            go_type:
              import: "github.com/bbxx111/accountkit/enum"
              type: "IdentityKind"
          - column: "session.revoke_reason"
            go_type:
              import: "github.com/bbxx111/accountkit/enum"
              type: "RevokeReason"
              pointer: true
          - column: "audit_event.result"
            go_type:
              import: "github.com/bbxx111/accountkit/enum"
              type: "Result"
              pointer: true
  - engine: "postgresql"
    queries: "audit/query.sql"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/auditdb"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "audit_event.result"
            go_type:
              import: "github.com/bbxx111/accountkit/enum"
              type: "Result"
              pointer: true
